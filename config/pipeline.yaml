# Central config for the EN -> Quebec French translation pipeline.
# Everything environment/GPU-specific lives here so the same code runs on an L4
# now and an A100/H100 later with only edits to this file.

paths:
  # All persistent artifacts live under /workspace (the RunPod network volume).
  workspace: /workspace
  okapi_home: /workspace/tools/okapi        # portable Okapi (Tikal/Rainbow)
  java_home: /workspace/tools/jdk           # portable OpenJDK (JRE 17+)
  tesseract_bin: tesseract                   # resolved from PATH after bootstrap
  hf_cache: /workspace/hf-cache
  work_dir: /workspace/jobs                  # per-job scratch (xliff, reports, media)

# --- Translation LLM served by vLLM (OpenAI-compatible) ------------------------
llm:
  # Active profile name (see profiles below). Switch this one line to change GPU tier.
  profile: a100

  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY                             # vLLM ignores it; must be non-empty
  request_timeout_s: 180
  max_concurrency: 16                        # in-flight requests to vLLM
  max_retries: 4
  temperature: 0.1                           # near-deterministic for translation
  top_p: 0.9
  # Cap output length per segment relative to source (guards runaway generations).
  max_tokens: 1024

profiles:
  l4:
    # FP8 (Ada-native on the L4) halves the ~18GB bf16 weights to ~9-10GB, freeing
    # ~11GB for KV cache. bf16 left almost no KV cache (~0.7GB), which starved
    # concurrent requests and caused short segments to be corrupted. FP8 gives full
    # context + stable concurrency with negligible quality loss for translation.
    model: Unbabel/Tower-Plus-9B
    dtype: bfloat16
    quantization: fp8
    gpu_memory_utilization: 0.90
    max_model_len: 8192
    tensor_parallel_size: 1
  a100:
    # Single 80GB A100/H100. Tower+ 72B does NOT fit here: even with online FP8 the
    # weights alone are ~73GB against a 0.92*80 = 73GB budget, so vLLM OOMs inside
    # fp8.py create_weights before any KV cache is reserved (validated live on an
    # A100-SXM4-80GB). Use the README-verified Tower+ 9B and spend the headroom on
    # KV cache: ~18GB bf16 weights leave ~55GB of cache, far more concurrency than
    # the L4. No FP8 — A100 is Ampere (SM80) with no native FP8 tensor cores, and
    # there's no memory pressure to justify it. 8192 is Tower-Plus-9B's hard native
    # max_position_embeddings (Gemma2); vLLM refuses to start above it.
    model: Unbabel/Tower-Plus-9B
    dtype: bfloat16
    quantization: null
    gpu_memory_utilization: 0.90
    max_model_len: 8192
    tensor_parallel_size: 1
  a100_72b_x2:
    # Tower+ 72B needs ~145GB just to hold the bf16 checkpoint, so it takes TWO 80GB
    # cards (tp=2). Quantization happens after load and does not reduce that ceiling.
    # Only select this profile on a multi-GPU pod — it OOMs on a single card.
    model: Unbabel/Tower-Plus-72B
    dtype: bfloat16
    quantization: fp8
    gpu_memory_utilization: 0.92
    max_model_len: 16384
    tensor_parallel_size: 2
  a6000:
    # 48GB Ampere (RTX A6000/A40/L40-class without native FP8 tensor cores — that's
    # Ada/Hopper only). Tower+ 72B needs ~145GB just to download the bf16 checkpoint
    # (quantization happens after download, doesn't shrink it), so it doesn't fit this
    # tier at all. Reuse the README-verified Tower+ 9B, but skip FP8 (no Ampere native
    # support, and we don't need the memory savings) and spend the A6000's extra ~25GB
    # of headroom over the 23GB L4 on KV cache: more concurrent requests, not more
    # context — Tower-Plus-9B (Gemma2 architecture) has a hard native max_position_
    # embeddings of 8192; vLLM refuses to start above that (validated live: 16384
    # raised a pydantic ValidationError at engine startup, VLLM_ALLOW_LONG_MAX_MODEL_LEN
    # is not safe for a RoPE-adjacent model like this one).
    model: Unbabel/Tower-Plus-9B
    dtype: bfloat16
    quantization: null
    gpu_memory_utilization: 0.90
    max_model_len: 8192
    tensor_parallel_size: 1

# --- Language / register -------------------------------------------------------
language:
  source: en
  target: fr-CA
  # SRX segmentation rules used by Okapi.
  srx: config/segmentation.srx

# --- Glossary / brand voice ----------------------------------------------------
glossary:
  tbx: glossary/brand_glossary.tbx
  style_guide: glossary/style_guide.md
  # If true, a required target term missing from the translation is a QA failure.
  enforce: true

# --- Translation memory --------------------------------------------------------
tm:
  db: /workspace/tm/qc_translate.sqlite
  tmx_export: /workspace/tm/qc_translate.tmx
  fuzzy_threshold: 0.80                       # >= reuse as reference; 1.0 = exact reuse

# --- Quality estimation --------------------------------------------------------
qe:
  enabled: true
  model: Unbabel/wmt22-cometkiwi-da           # reference-free QE
  # Segments scoring below this are flagged for the human reviewer first.
  flag_below: 0.75
  batch_size: 16
  backtranslation:
    enabled: false                            # optional second signal on low-QE segments
    model: facebook/nllb-200-distilled-1.3B

# --- Images --------------------------------------------------------------------
images:
  ocr_langs: eng                              # OCR the *source* (English) text
  # Min OCR confidence (0-100) for a detected text block to count as "has text".
  min_confidence: 40
  # Suggest an FR rendering for detected in-image text via the LLM.
  suggest_translation: true
