[project]
name = "qc-translate"
version = "0.1.0"
description = "EN -> Quebec French DOCX translation pipeline (open-source, RunPod)"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "lxml>=5.2",
    "pytesseract>=0.3.10",
    "Pillow>=10.3",
    "jinja2>=3.1",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavy GPU deps installed on the pod by bootstrap.sh, kept optional so the
# pipeline glue can be imported/tested on a machine without CUDA.
serve = [
    "vllm>=0.6.0",
]
qe = [
    # Unbabel COMET (CometKiwi / xCOMET) reference-free quality estimation.
    "unbabel-comet>=2.2.2",
    # NLLB back-translation spot-check.
    "transformers>=4.44",
    "sentencepiece>=0.2",
]

[project.scripts]
qc-translate = "qc_translate.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
